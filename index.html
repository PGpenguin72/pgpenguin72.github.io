<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>已搬家 → pg72.tw</title>
  <meta http-equiv="refresh" content="6; url=https://pg72.tw/">
  <link rel="canonical" href="https://pg72.tw/">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #1c2230; --muted: #6b7385;
      --accent: #3b82f6; --border: #e3e7ef; --track: #e8ecf3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
        --accent: #58a6ff; --border: #30363d; --track: #21262d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; padding: 36px 28px 28px; text-align: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
    }
    .penguin { font-size: 56px; line-height: 1; animation: waddle 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes waddle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    h1 { margin: 18px 0 8px; font-size: 22px; }
    p { margin: 0; color: var(--muted); line-height: 1.7; }
    .btn {
      display: block; margin: 24px 0 14px; padding: 12px 16px; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .bar { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--accent); animation: fill 6s linear forwards; }
    @keyframes fill { to { width: 100%; } }
    .old { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .penguin, .bar span { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="penguin">🐧</div>
    <h1>這隻企鵝搬家了！</h1>
    <p>新網站在 <strong>pg72.tw</strong><br><span id="count">6</span> 秒後自動帶你過去</p>
    <a class="btn" href="https://pg72.tw/">前往 pg72.tw →</a>
    <div class="bar"><span></span></div>
    <a class="old" href="/old/">想看舊網站？（舉一反三是件好事）</a>
  </main>
  <script>
    let n = 6; const el = document.getElementById('count');
    const t = setInterval(() => { n--; if (n <= 0) { clearInterval(t); location.replace('https://pg72.tw/'); } else el.textContent = n; }, 1000);
  </script>
</body>
</html>
